apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
namePrefix: demo-
buildMetadata:
  - managedByLabel
resources:
  - ../simple
components:
  - ../component
patches:
  - path: patch.yaml
configMapGenerator:
  - name: generated
    literals:
      - mode=generated
generatorOptions:
  disableNameSuffixHash: true
