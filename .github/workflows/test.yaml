name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Test suite setup
        uses: fluxcd/gha-workflows/.github/actions/setup-kubernetes@v0.17.0
        with:
          go-version: 1.27.x
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
      - name: Run shellcheck
        run: shellcheck scripts/*.sh actions/validate/*.sh
      - name: Run tests
        run: make test
      - name: Run linters
        run: make lint
      - name: Build binary
        run: make build
      - name: Add flux-schema to PATH
        run: echo "${GITHUB_WORKSPACE}/bin" >> "$GITHUB_PATH"
      - name: Run smoke test
        run: |
          flux install --export | flux-schema validate -v --schema-location ./catalog/latest
      - name: Checkout example repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fluxcd/flux2-kustomize-helm-example
          path: example
      - name: Test validate action
        uses: ./actions/validate
        with:
          path: example
      - name: Test validate action with envsubst
        run: |
          mkdir -p "${RUNNER_TEMP}/envsubst-test/overlay"
          cat << 'EOF' > "${RUNNER_TEMP}/envsubst-test/ingress.yaml"
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: app.${CLUSTER_DOMAIN}
          spec:
            rules:
              - host: app.${CLUSTER_DOMAIN}
          EOF
          cat << 'EOF' > "${RUNNER_TEMP}/envsubst-test/overlay/kustomization.yaml"
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../ingress.yaml
          EOF
          echo "CLUSTER_DOMAIN=example.com" > "${RUNNER_TEMP}/flux.env"
          if ./actions/validate/validate.sh -d "${RUNNER_TEMP}/envsubst-test" -- \
            --schema-location ./catalog/latest; then
            echo "expected validation to fail without --envsubst"
            exit 1
          fi
          ./actions/validate/validate.sh -d "${RUNNER_TEMP}/envsubst-test" \
            -E "${RUNNER_TEMP}/flux.env" -b "${RUNNER_TEMP}/bundle.yaml" -- \
            --schema-location ./catalog/latest
          [[ "$(grep -Fc 'host: app.example.com' "${RUNNER_TEMP}/bundle.yaml")" -ge 2 ]]
      - name: Test validate action skips kustomize bases
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/bases-test/base" "${RUNNER_TEMP}/bases-test/overlay"
          cat << 'EOF' > "${RUNNER_TEMP}/bases-test/base/deployment.yaml"
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: app
          spec:
            template:
              metadata:
                labels:
                  app: app
              spec:
                containers:
                  - name: app
                    image: app
          EOF
          cat << 'EOF' > "${RUNNER_TEMP}/bases-test/base/kustomization.yaml"
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - deployment.yaml
          EOF
          cat << 'EOF' > "${RUNNER_TEMP}/bases-test/overlay/kustomization.yaml"
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../base
          patches:
            - target:
                kind: Deployment
              patch: |
                - op: add
                  path: /spec/selector
                  value:
                    matchLabels:
                      app: app
          EOF
          if flux-schema validate --schema-location ./catalog/latest "${RUNNER_TEMP}/bases-test/base"; then
            echo "expected the base to fail validation on its own"
            exit 1
          fi
          ./actions/validate/validate.sh -d "${RUNNER_TEMP}/bases-test" -- \
            --schema-location ./catalog/latest | tee "${RUNNER_TEMP}/bases-test.log"
          grep -Fqx "INFO - Validating kustomize overlay ${RUNNER_TEMP}/bases-test/overlay" "${RUNNER_TEMP}/bases-test.log"
          grep -Fqx "INFO - Skipping kustomize base ${RUNNER_TEMP}/bases-test/base" "${RUNNER_TEMP}/bases-test.log"
      - name: Test validate action result order
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/order-test"
          for name in c a d b; do
            printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: %s\n' "$name" \
              > "${RUNNER_TEMP}/order-test/${name}.yaml"
          done
          ./actions/validate/validate.sh -d "${RUNNER_TEMP}/order-test" -- \
            -v --schema-location ./catalog/latest | grep -F ' is valid' > "${RUNNER_TEMP}/order-test.log"
          [[ "$(wc -l < "${RUNNER_TEMP}/order-test.log")" -eq 4 ]]
          LC_ALL=C sort -c "${RUNNER_TEMP}/order-test.log"
      - name: Test validate action relative report paths
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/abs-test/apps" "${GITHUB_WORKSPACE}/abs-test/skip"
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: app\n' \
            > "${GITHUB_WORKSPACE}/abs-test/apps/app.yaml"
          printf 'apiVersion: v1\nkind: Unknown\n' > "${GITHUB_WORKSPACE}/abs-test/skip/bad.yaml"
          ./actions/validate/validate.sh -d "${GITHUB_WORKSPACE}/abs-test" \
            -e "${GITHUB_WORKSPACE}/abs-test/skip" -- \
            --schema-location ./catalog/latest -o junit -d "${RUNNER_TEMP}/abs-test-report"
          grep -Fq 'file="abs-test/apps/app.yaml"' "${RUNNER_TEMP}"/abs-test-report/*.xml
          rm -rf "${GITHUB_WORKSPACE}/abs-test"
      - name: Test validate action excludes kustomize overlays
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/exclude-test/app" "${RUNNER_TEMP}/exclude-test/skip"
          printf 'apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: app\n' \
            > "${RUNNER_TEMP}/exclude-test/app/app.yaml"
          printf 'resources:\n  - app.yaml\n' > "${RUNNER_TEMP}/exclude-test/app/kustomization.yaml"
          printf 'apiVersion: v1\nkind: Unknown\n' > "${RUNNER_TEMP}/exclude-test/skip/bad.yaml"
          printf 'resources:\n  - bad.yaml\n' > "${RUNNER_TEMP}/exclude-test/skip/kustomization.yaml"
          ./actions/validate/validate.sh -d "${RUNNER_TEMP}/exclude-test" \
            -e "${RUNNER_TEMP}/exclude-test/skip" -- \
            --schema-location ./catalog/latest | tee "${RUNNER_TEMP}/exclude-test.log"
          grep -Fqx "INFO - Validating kustomize overlay ${RUNNER_TEMP}/exclude-test/app" "${RUNNER_TEMP}/exclude-test.log"
          if grep -Fq "exclude-test/skip" "${RUNNER_TEMP}/exclude-test.log"; then
            echo "expected the excluded overlay to be skipped"
            exit 1
          fi
      - name: Build Docker image
        run: make docker-build
      - name: Run Docker smoke test
        run: |
          flux install --export | docker run --rm -i ghcr.io/fluxcd/flux-schema:latest-dev \
            validate -v --schema-location /catalog/latest
      - name: Check if working tree is dirty
        run: |
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'run make test and commit changes'
            exit 1
          fi
