name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Test suite setup
        uses: fluxcd/gha-workflows/.github/actions/setup-kubernetes@v0.14.0
        with:
          go-version: 1.26.x
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
      - name: Run shellcheck
        run: shellcheck scripts/*.sh actions/validate/*.sh
      - name: Run tests
        run: make test
      - name: Run linters
        run: make lint
      - name: Build binary
        run: make build
      - name: Add flux-schema to PATH
        run: echo "${GITHUB_WORKSPACE}/bin" >> "$GITHUB_PATH"
      - name: Run smoke test
        run: |
          flux install --export | flux-schema validate -v --schema-location ./catalog/latest
      - name: Checkout example repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fluxcd/flux2-kustomize-helm-example
          path: example
      - name: Test validate action
        uses: ./actions/validate
        with:
          path: example
      - name: Test validate action with envsubst
        run: |
          mkdir -p "${RUNNER_TEMP}/envsubst-test/overlay"
          cat << 'EOF' > "${RUNNER_TEMP}/envsubst-test/ingress.yaml"
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: app.${CLUSTER_DOMAIN}
          spec:
            rules:
              - host: app.${CLUSTER_DOMAIN}
          EOF
          cat << 'EOF' > "${RUNNER_TEMP}/envsubst-test/overlay/kustomization.yaml"
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../ingress.yaml
          EOF
          echo "CLUSTER_DOMAIN=example.com" > "${RUNNER_TEMP}/flux.env"
          if ./actions/validate/validate.sh -d "${RUNNER_TEMP}/envsubst-test" -- \
            --schema-location ./catalog/latest; then
            echo "expected validation to fail without --envsubst"
            exit 1
          fi
          ./actions/validate/validate.sh -d "${RUNNER_TEMP}/envsubst-test" \
            -E "${RUNNER_TEMP}/flux.env" -- --schema-location ./catalog/latest
      - name: Build Docker image
        run: make docker-build
      - name: Run Docker smoke test
        run: |
          flux install --export | docker run --rm -i ghcr.io/fluxcd/flux-schema:latest-dev \
            validate -v --schema-location /catalog/latest
      - name: Check if working tree is dirty
        run: |
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'run make test and commit changes'
            exit 1
          fi
