name: release
on:
  push:
    tags: ['v*']
    branches: ['test-cli-plugin-feature-branch-release']

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # for creating the GitHub release.
      id-token: write # for creating OIDC tokens for signing.
      attestations: write # for GitHub Attestations.
      artifact-metadata: write # for GitHub SLSA provenance.
      packages: write # for pushing and signing container images.
    uses: matheuscscp/gha-workflows/.github/workflows/cli-plugin-release.yaml@6290d03da61a61dae0af70655bd9b730f99b2e00
    with:
      go-version: 1.26.x
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
